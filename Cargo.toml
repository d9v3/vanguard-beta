[package]
name = "vanguard"
version = "0.87.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.6.0"
blake3 = { version = "1.8.7", default-features = false, features = ["pure", "std"] }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
dns-lookup = "4.0.2"
# join_all et buffer_unordered seulement : la partie « util », déjà amenée par hyper-util, sans l'exécuteur ni les
# macros (un proc-macro compilé avec syn) de la crate complète.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
if-addrs = "0.15.0"
inventory = "0.3.25"
miniz_oxide = "0.9.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
# HTTPS en Rust : HTTP/2 et le proxy du système avec rustls, mais ring pour le chiffrement au lieu d'aws-lc, qui
# compile du C impossible à construire ici pour macOS et pèse le double. Ni « json » ni « charset » : le corps est lu
# en octets (http.rs) puis décodé par Vanguard.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
notify = { version = "8.2.0", default-features = false }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1 et MD5 de RustCrypto (de la même famille que sha2, déjà là). SHA-1 pour l'empreinte
# de la machine et la recherche d'un mot de passe dans les fuites (Have I Been Pwned), MD5 et SHA-1 pour les
# empreintes publiées à côté des vieux téléchargements. De la crypto relue par d'autres, plutôt qu'écrite ici.
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
# SHA-256 : l'empreinte du script lancé en administrateur sous Windows, vérifiée par la fenêtre élevée avant de
# l'exécuter ; celle des programmes et des fichiers des traces collectées, à chercher sur VirusTotal.
sha2 = { version = "0.11.1", default-features = false }
# Seulement ce qui sert : le moteur (un ou plusieurs fils), le réseau, les délais, la lecture et l'écriture des
# connexions, #[tokio::main] et #[tokio::test]. Ni fichiers, ni processus, ni signaux.
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros"] }
ed25519-dalek = { version = "3.0.0", default-features = false }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# WMI et COM sans PowerShell (Microsoft) : seulement les fonctions lues par Vanguard, jamais l'interface graphique
# (Win32_UI_WindowsAndMessaging seulement pour la taille et la place de la fenêtre de la console, voir fenetre.rs) ; Win32_UI_Shell_PropertiesSystem n'en est pas : les propriétés d'un volume (BitLocker). Win32_Security : les SID et les droits des comptes ; TaskScheduler : les tâches planifiées ; UpdateAgent : Windows Update ; WindowsFirewall : les règles du blocage (INetFwPolicy2), dans le processus élevé.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Surveillance des fichiers en direct (intégrité) : FSEvents sous macOS.
[target."cfg(target_os = \"macos\")".dependencies]
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# DNS, proxy et services réseau en vigueur (SCDynamicStore, SCPreferences), au lieu de scutil et networksetup. Déjà
# dans l'arbre par hyper-util (le proxy système de reqwest), même version : aucun code nouveau compilé. Ses fonctions
# sûres ne sont pas toutes prises : `SCNetworkService::enabled` rend l'inverse de SCNetworkServiceGetEnabled (0.7.0),
# et plusieurs constructeurs paniquent sur un pointeur nul ; machine/macos/config_reseau.rs passe par -sys.
system-configuration = "0.7.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
# Dépassements de capacité vérifiés aussi dans la version publiée : l'option que cite la note du chapitre « Traitement
# des entiers » du guide Rust sécurisé de l'ANSSI. Elle ne remplace pas sa règle LANG-ARITH, qui veut des opérations
# explicites (checked_, saturating_, wrapping_…) partout où un entier peut déborder, quel que soit le profil : c'est
# un filet pour celles qu'on oublie. Sans lui, une taille ou un décalage lu dans une donnée hostile (paquet réseau,
# bail, journal, fichier PE) qui déborde repart à zéro en silence et fausse la suite de la lecture ; ici, il panique,
# comme en développement. La panique est rattrapée autour de chaque règle et de chaque domaine du bilan, de chaque
# mesure DNS de l'audit et de chaque fichier analysé par YARA (« non vérifié », journal::rattraper) : panic garde donc
# sa valeur par défaut, « unwind », jamais « abort ». Hors de ces gardes, sur le fil principal, elle arrête la
# commande. Dans un autre fil, elle n'arrête que lui, s'affiche et se note comme un plantage, et l'appelant qui le
# joint en fait ce qu'il a prévu : souvent « non vérifié », parfois un résultat vide qui ne se dit pas (Flatpak, Snap,
# AUR, micrologiciels et DKMS de machine/linux/maj.rs, Windows Update, Homebrew, constats réseau et carnet relus par
# audit::auditer). Ce filet ne dispense donc jamais d'une opération explicite : une somme de données que n'importe
# quel programme peut poser (tailles de fichiers creux à nettoyer ou à copier) sature, au lieu de compter sur lui.
overflow-checks = true

# Les bibliothèques en développement : seulement les numéros de ligne (les traces d'erreur restent lisibles). Avec toutes
# leurs informations de débogage, YARA-X et wasmtime portaient le programme de test bien au-delà de ce que la mise à
# jour depuis la clé accepte de lire (mise_a_jour.rs, TAILLE_MAX, 512 Mio), que lit le test ce_programme_porte_sa_version.
[profile.dev.package."*"]
debug = "line-tables-only"

# Les programmes de test eux aussi : avec les informations complètes de Vanguard lui-même, celui de Windows pesait
# 520 Mo le 23 oct. 2026, à 97 % de TAILLE_MAX, et ce test aurait échoué sous Wine et dans la VM au premier module de
# plus. `cargo run` et le programme de mise au point gardent tout pour le débogueur (profil dev).
[profile.test]
debug = "line-tables-only"

# SHA-256 optimisé même en développement : sans cela, les empreintes des traces (programmes en marche, fichiers récents)
# prenaient plus d'une minute dans `cargo run` et dans les tests, contre quelques secondes une fois optimisé.
[profile.dev.package.sha2]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"

# Mode strict de clippy (pedantic) par défaut, sauf trois règles qui ne sont ici que du bruit :
# noms propres dans les commentaires en français, longues fonctions d'audit, `use ui::*`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

# `fuzzing` : posé par cargo-fuzz pour le banc de fuzz/, qui inclut des modules de src/ par leur chemin (sqlite.rs
# y ouvre sa lecture des colonnes, réservée à macOS ailleurs). Déclaré pour que la compilation de Vanguard ne le
# prenne pas pour une faute de frappe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
proptest = "1.12.0"
# Oracle du lecteur .evtx maison (src/journaux_windows/evtx/) : la lecture croisée de ses tests compare nos
# événements aux siens. Jamais dans le programme (une dépendance de plus qui lirait des données hostiles), sans ses
# fonctions par défaut (le programme evtx_dump, rayon). 0.13.0 (22 oct. 2026) et pas 0.12.3 : celle-ci amène
# `encoding`, abandonnée (RUSTSEC-2021-0153), que deny.toml refuse ; 0.13.0 l'a remplacée par encoding_rs.
evtx = { version = "=0.13.0", default-features = false }
# Oracle du moteur YARA maison (src/protection/moteur_yara.rs) : ses tests compilent les mêmes règles avec YARA-X et
# comparent les correspondances, fichier par fichier, et les champs des modules pe et elf. Jamais dans le programme
# (`cargo tree -e normal` ne le montre pas) : il y amenait wasmtime et cranelift, 150 crates de plus, et du C à
# compiler pour chaque cible. Seulement les modules dont les règles intégrées ont besoin (pe, elf). YARA-X 1.22.0
# demande wasmtime 48.0.6 ou plus ; Cargo.lock retient 48.0.7, la première de la série 48 qui corrige aussi
# RUSTSEC-2026-0379 (Cranelift, saut mal calculé sur aarch64), ce que cargo deny surveille encore.
yara-x = { version = "1.22.0", default-features = false, features = ["pe-module", "elf-module", "constant-folding", "exact-atoms", "fast-regexp"] }
