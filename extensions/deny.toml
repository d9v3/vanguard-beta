# Ce que les dépendances de la bibliothèque des extensions (sdk) et de l'exemple en Rust ont le droit d'être, vérifié
# par cargo deny (outils/verifier.sh, et chaque nuit dans la CI), comme deny.toml pour Vanguard. Les deux n'en ont
# aucune aujourd'hui (le JSON du protocole est écrit à la main) : la première qui viendrait passerait les mêmes règles.
# À part de deny.toml : ses failles admises (venues de YARA-X) n'ont rien à faire ici.

# Les cibles où un plugin tourne : celles de Vanguard.
[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
]

# Failles connues, bibliothèques abandonnées ou au code défaillant : refusées, dans tout l'arbre (sans « all »,
# cargo deny ne regarde le code défaillant que dans les dépendances directes), sans exception.
[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

# Aucune licence de tiers permise d'avance : une dépendance demande d'abord une décision (CLAUDE.md, « Nouvelle
# dépendance »), puis sa licence ici. La bibliothèque et l'exemple eux-mêmes (GPL-3.0-or-later) sont nommés : toute
# autre crate passe par la liste, même locale et jamais publiée (publish = false), comme du code de tiers copié dans
# le dépôt. Le passage de la bibliothèque seule ne voit pas l'exemple : son exception n'y sert pas, sans remarque.
[licenses]
allow = []
confidence-threshold = 0.8
exceptions = [
    { crate = "vanguard-extension", allow = ["GPL-3.0-or-later"] },
    { crate = "rust-exemple", allow = ["GPL-3.0-or-later"] },
]
unused-license-exception = "allow"

# L'exemple prend la bibliothèque par son chemin (../../sdk), sans version : cargo deny l'admet parce que l'exemple
# n'est jamais publié, et admet de même toute dépendance par chemin d'une crate jamais publiée ; une dépendance de
# crates.io sans version reste refusée. Ce qu'un chemin amène passe quand même par les licences, plus haut.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# crates.io seulement : ni autre registre, ni dépôt git.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
