# Claude sur GitHub : écrire @claude dans un ticket, une demande de fusion (PR) ou un commentaire pour lui poser une
# question ou lui demander une correction ; il suit CLAUDE.md. Seul le propriétaire du dépôt le déclenche : vérifié
# ici avant même de démarrer (un dépôt public reçoit des commentaires de n'importe qui), puis par l'action elle-même.
# Jamais sur une demande de fusion venue d'un fork, ni sur un ticket qu'il n'a pas écrit lui-même, ni sur un fil où un
# autre a commenté, ni sur un ticket du journal de la clé (le travail « garde »).
# Activation, une fois : /install-github-app dans Claude Code (application GitHub + secret CLAUDE_CODE_OAUTH_TOKEN,
# le jeton de l'abonnement Claude, que donne `claude setup-token`).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  # Une demande de fusion venue d'un fork n'est jamais traitée : Claude y lancerait cargo build et cargo test, donc le
  # build.rs et les tests de ce code étranger, avec le droit d'écrire dans le dépôt et le jeton de l'abonnement
  # (campagne d'attaque n° 3). Ce garde lit d'où vient la demande, en lecture seule, sans secret ni code extrait ; le
  # numéro passe par une variable, jamais dans le script.
  # Claude lit tout le ticket ou la demande, pas seulement le commentaire qui l'appelle : écrits par un autre que le
  # propriétaire, ils seraient des consignes pour un agent qui a ces droits. De même un ticket « journal » : la
  # partition VANGUARDLOG s'écrit sur n'importe quel ordinateur, et outils/journal-vers-github.py en fait des tickets
  # sous le compte du propriétaire (campagne d'attaque n° 4). Et sur un dépôt public, n'importe qui commente le ticket
  # ou la demande du propriétaire : Claude lirait ce commentaire comme le reste du fil. Le garde relit donc tout le fil
  # (commentaires, et pour une demande ses revues et commentaires de revue) et refuse s'il y trouve un auteur autre
  # que le propriétaire ou les robots de Claude et de GitHub Actions, que personne d'autre ne peut faire écrire ici
  # (relecture adverse de la campagne 4). Un fil illisible (panne de l'API) est refusé, pas supposé propre.
  garde:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER' && github.event.issue.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER'
        && github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
        && github.event.review.author_association == 'OWNER'
        && github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      permis: ${{ steps.origine.outputs.permis }}
    steps:
      # Seulement le script qui relit le fil, pris de la branche principale : jamais celui d'une demande de fusion.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .garde
          sparse-checkout: outils/fil-du-proprietaire.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: origine
        env:
          GH_TOKEN: ${{ github.token }}
          DEMANDE: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
          ETIQUETTES: ${{ join(github.event.issue.labels.*.name, ',') }},${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$ETIQUETTES," in
            *,journal,*)
              echo "::warning::Ticket du journal de la clé, écrit depuis n'importe quel ordinateur : Claude n'y est pas lancé."
              echo "permis=non" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -n "$DEMANDE" ]; then
            tete=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$DEMANDE" --jq .head.repo.full_name) || tete=
            if [ "$tete" != "$GITHUB_REPOSITORY" ]; then
              echo "::warning::Demande de fusion venue de « ${tete:-un dépôt supprimé} » : Claude n'y est pas lancé."
              echo "permis=non" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Tout le fil : un auteur autre que le propriétaire (ou les robots de Claude et d'Actions) et rien ne se lance.
          if ! sh .garde/outils/fil-du-proprietaire.sh; then
            echo "permis=non" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "permis=oui" >>"$GITHUB_OUTPUT"
  claude:
    needs: garde
    # Le garde a déjà vérifié le propriétaire et l'origine de la demande ; sauté ou refusé, rien ne se lance.
    if: needs.garde.outputs.permis == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Le jeton de l'extraction n'est pas laissé dans .git/config, où tout programme lancé ensuite le lirait.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # .cargo/config.toml vise la cible musl : sans elle, cargo test ne compile pas.
      - name: Rust à jour
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          # musl-gcc : YARA-X compile un petit fichier C pour la cible musl.
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      # Des minutes ont passé depuis le garde (machine, Rust, apt-get) : un autre a pu commenter entre-temps. Le fil
      # est verrouillé (seuls le propriétaire et ceux qui ont accès au dépôt y écrivent encore), puis relu par le même
      # script que le garde, juste avant Claude ; un autre auteur, ou un fil illisible, et rien ne se lance. Déverrouillé
      # à la fin, quoi qu'il arrive, seulement si c'est ce travail qui l'a verrouillé.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .garde
          sparse-checkout: outils/fil-du-proprietaire.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: verrou
        env:
          GH_TOKEN: ${{ github.token }}
          DEMANDE: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fil="repos/$GITHUB_REPOSITORY/issues/$NUMERO"
          verrouille=$(gh api "$fil" --jq .locked)
          if [ "$verrouille" != true ]; then
            gh api -X PUT "$fil/lock" -f lock_reason=resolved >/dev/null
            echo "verrouille=oui" >>"$GITHUB_OUTPUT"
          fi
          sh .garde/outils/fil-du-proprietaire.sh
          rm -rf .garde
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*)"
      - name: Fil déverrouillé
        if: always() && steps.verrou.outputs.verrouille == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$NUMERO/lock"
