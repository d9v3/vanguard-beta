# Version macOS de Vanguard : compilée et testée sur un vrai Mac de GitHub (Apple Silicon), puisqu'il n'y a pas
# de Mac à la maison. Le programme produit est universel (Apple Silicon + Intel) ; outils/deployer.sh le
# récupère pour la clé USB (dossier macOS/).
#
# Le dépôt est public depuis le 20 octobre 2026 : les minutes de Mac ne sont plus comptées. La compilation de nuit ne
# part quand même que si le code a changé depuis la dernière réussie.
name: macOS

on:
  workflow_dispatch:
    inputs:
      essai_complet:
        description: "Essai complet de chaque fonction (outils/test-macos/essai.sh), en plus de la compilation"
        type: boolean
        default: false
  push:
    branches: [macos]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", ".github/workflows/macos.yml"]
  schedule:
    # 3 h 17, heure de Montréal. GitHub la lance souvent bien plus tard (4 h 45 de retard le 18 oct. 2026, 7 h 20 le
    # 19) : regarder `gh run list --workflow macos.yml --event schedule` avant de la croire absente.
    - cron: "17 7 * * *"

# Le jeton par défaut du dépôt ne lit que le code : la vérification de nuit lit aussi les exécutions passées
# (gh api …/actions/workflows/…/runs), sinon GitHub répond 403. Aucune extraction ne laisse ce jeton dans
# .git/config (persist-credentials: false) : tout ce qui tourne ensuite l'y lirait, scripts de compilation des
# dépendances compris ; aucun travail ne pousse ni ne refait de git fetch.
permissions:
  contents: read
  actions: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  utile:
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.verifier.outputs.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/hors-code.txt
          sparse-checkout-cone-mode: false
      - id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "compiler=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Le code a changé : un fichier que le programme intègre, hors de la liste de .github/hors-code.txt (la même
          # pour ci.yml et outils/publier-version.sh). Comparaison impossible (commit disparu, plus de 300 fichiers) :
          # on compile.
          HORS_CODE=$(grep -v '^#' .github/hors-code.txt | head -n 1)
          # Liste absente ou vide : un motif vide écarterait tous les fichiers, et le Mac serait sauté à tort.
          [ -n "$HORS_CODE" ] || { echo "::warning::.github/hors-code.txt illisible : on compile"; HORS_CODE='^$'; }
          depot="${{ github.repository }}"
          ici="${{ github.sha }}"
          compiler=oui
          # Les dernières compilations réussies de toutes les branches : celle d'une branche fusionnée depuis (son
          # passage sur le Mac avant la publication) vaut pour ce commit s'il en descend et que le programme n'a pas
          # changé. Sans cela, la nuit recompilait ce que la publication du jour venait de compiler.
          for dernier in $(gh api "repos/$depot/actions/workflows/macos.yml/runs?status=success&per_page=20" -q '[.workflow_runs[].head_sha] | unique | .[]'); do
            if [ "$dernier" = "$ici" ]; then compiler=non; break; fi
            # « ahead » ou « identical » : ce commit descend de celui de la compilation.
            etat=$(gh api "repos/$depot/compare/$dernier...$ici" -q '.status') || continue
            case "$etat" in ahead|identical) ;; *) continue ;; esac
            fichiers=$(gh api "repos/$depot/compare/$dernier...$ici" -q '[.files[].filename] | if length < 300 then .[] else "plus de 300 fichiers" end') || continue
            if ! printf '%s\n' "$fichiers" | grep -vE -e '^$' -e "$HORS_CODE" >/dev/null; then compiler=non; break; fi
          done
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

  mac:
    needs: utile
    if: needs.utile.outputs.compiler == 'oui'
    runs-on: macos-latest
    # Sur master, tout se compile sans cache (voir plus bas) : plus long qu'une branche qui reprend le sien.
    timeout-minutes: 60
    steps:
      # Tout l'historique : la date gravée est celle du code (outils/date-du-code.sh), le dernier commit qui a touché
      # le programme, la même que gravent Linux et Windows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # La chaîne de rust-toolchain.toml, avec les cibles Apple Silicon et Intel.
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # Actions venues d'autres que GitHub : épinglées par leur commit. Une étiquette (v2) se déplace ; si leur dépôt était
      # piraté, une version piégée toucherait ce que compile ce travail. À mettre à jour à la main (le commentaire dit la
      # version).
      # Jamais sur master : son programme est celui que la clé de l'auteur signe (outils/publier-version.sh ne prend
      # que lui). Un cache se reprend d'un passage à l'autre, et un compte GitHub pris pourrait en préparer un piégé
      # (dépendances déjà compilées) ; master compile donc tout depuis les sources, à chaque fois.
      # Par le nom court : une étiquette nommée master porte le même headBranch que la branche, et
      # outils/publier-version.sh ne lit que ce nom.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_name != 'master'
      # .cargo/config.toml vise Linux par défaut : la cible est toujours donnée.
      # Les tests qui ne peuvent pas tourner ici le notent dans VANGUARD_TESTS_SAUTES (src/essais.rs) : sans lui,
      # libtest avale leur message et les compte réussis. Comptés et montrés au résumé, même si les tests échouent :
      # non vérifié n'est jamais compté sain, comme dans outils/verifier.sh.
      - name: Tests
        env:
          VANGUARD_TESTS_SAUTES: ${{ runner.temp }}/sautes.txt
        run: cargo test --locked --target aarch64-apple-darwin
      - name: Tests sautés sur le Mac
        if: always()
        env:
          VANGUARD_TESTS_SAUTES: ${{ runner.temp }}/sautes.txt
        run: |
          if [ -s "$VANGUARD_TESTS_SAUTES" ]; then
            n=$(wc -l < "$VANGUARD_TESTS_SAUTES" | tr -d ' ')
            echo "::warning::$n tests sautés (non vérifiés)"
            { echo "### Tests sautés sur macOS : $n"; sed 's/^/- /' "$VANGUARD_TESTS_SAUTES"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # cargo-auditable et cargo-audit comme dans ci.yml (versions épinglées, empreintes vérifiées, aucun repli),
      # posés en quelques secondes après les tests : un passage en échec ne les télécharge pas.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-auditable@0.7.7,cargo-audit@0.22.2,cargo-cyclonedx@0.5.9
          fallback: none
      # Les deux Mac d'un seul cargo : l'optimisation finale (LTO, une seule unité de code) n'occupe qu'un cœur par
      # programme, et cargo les mène de front. L'un après l'autre, elles prenaient 140 s, soit plus de la moitié du
      # passage, et chaque minute de Mac en compte dix. Chacun porte la liste de ses dépendances, versions comprises
      # (cargo auditable) ; cargo audit ne lit pas un programme universel : les deux moitiés sont vérifiées avant lipo.
      - name: Compilation
        run: |
          SOURCE_DATE_EPOCH=$(bash outils/date-du-code.sh)
          export SOURCE_DATE_EPOCH
          cargo auditable build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
          bash outils/failles-programmes.sh target/aarch64-apple-darwin/release/vanguard \
            target/x86_64-apple-darwin/release/vanguard
          lipo -create -output vanguard \
            target/aarch64-apple-darwin/release/vanguard target/x86_64-apple-darwin/release/vanguard
          lipo -info vanguard
          ./vanguard --version
          echo "${{ github.sha }}" > commit.txt
          # L'empreinte dite dans le journal de ce passage, à part de l'artefact : outils/publier-version.sh la compare
          # au programme téléchargé avant de le signer (un artefact remplacé après coup ne la porte pas).
          echo "EMPREINTE-VANGUARD-MACOS $(shasum -a 256 vanguard | cut -d' ' -f1)"
      # Les nomenclatures (SBOM) des programmes de la version, les mêmes octets que celles qu'outils/publier-version.sh
      # refait chez l'auteur : il les compare avant de les joindre à la page.
      - name: Nomenclatures (SBOM)
        run: bash outils/sbom.sh sbom
      - name: Essai du programme sur ce Mac
        run: |
          ./vanguard audit --json > audit.json || true
          head -c 3000 audit.json
          ./vanguard diagnostic | tail -20 || true
      # La moitié Intel du programme universel, que ce Mac Apple Silicon ne lance jamais tout seul : par Rosetta 2,
      # posée si elle manque. Sans Rosetta, c'est dit (avertissement du passage), jamais compté comme essayé.
      - name: Essai de la moitié Intel (Rosetta 2)
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license || true
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 absente : la moitié Intel du programme n'a pas été essayée."
            exit 0
          fi
          arch -x86_64 ./vanguard --version
          arch -x86_64 ./vanguard audit --json > audit-intel.json
          python3 -c "import json; b = json.load(open('audit-intel.json')); assert b['constats'], 'bilan sans constats'; print(len(b['constats']), 'constats (Intel)')"
      - name: Essai complet
        if: github.event_name == 'workflow_dispatch' && inputs.essai_complet
        run: bash outils/test-macos/essai.sh ./vanguard essai
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.essai_complet
        with:
          name: essai-macos
          path: essai
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanguard-macos
          path: |
            vanguard
            commit.txt
            audit.json
            sbom/*.cdx.json
          retention-days: 30

  # L'attestation de provenance (actions/attest, Sigstore) du programme Mac et des nomenclatures : signée au nom de ce
  # fichier, de ce dépôt et de ce commit, inscrite au registre public Rekor, que tout le monde vérifie avec
  # « gh attestation verify ». outils/publier-version.sh l'exige avant de publier. Master seulement : c'est son
  # programme que la clé de l'auteur signe ; ref complète, une étiquette nommée master n'en a pas.
  # Un travail à part, qui ne lance rien du dépôt : le jeton OIDC (id-token) qui signe une attestation n'est jamais
  # à portée des scripts de compilation des dépendances, qui sinon pourraient faire attester n'importe quel fichier.
  attester:
    needs: mac
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vanguard-macos
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            vanguard
            sbom/*.cdx.json
