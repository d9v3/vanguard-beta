# Intégration continue. Le travail principal lance outils/verifier.sh, la vérification complète de l'ordinateur de
# l'auteur (mise en forme, clippy sans remarque sur les quatre cibles, tests, la suite refaite sans Internet, scripts
# PowerShell, shell et Python, extensions, essais des outils de la clé, liens internes, dépendances, failles connues,
# banc de fuzzing), sauf Wine : une seule logique, la même ici et là-bas, au lieu d'une copie qui divergeait. Il tourne
# à chaque envoi sur master (la publication du jour) et à chaque demande de fusion, avec le garde-fou de
# confidentialité. Sur un vrai Windows de GitHub (PowerShell, registre, winget) : à chaque envoi et à chaque demande de
# fusion, la nuit si le code a changé, et à la demande (gh workflow run ci.yml) ; la compilation reproductible et
# l'essai du .exe livré (MinGW) aussi, sauf pour une demande de fusion. Chaque nuit, même sans changement : les failles
# connues des dépendances, leurs licences et leur provenance, et cinq minutes de fuzzing par cible. macOS a son propre
# workflow (macos.yml), qui teste et compile le programme universel pour la clé.
#
# Le dépôt est public depuis le 20 octobre 2026 : les minutes de Linux et de Windows ne sont plus comptées, Windows
# tourne donc à chaque envoi.
name: CI

on:
  # master seulement : l'étiquette vX.Y.Z que crée outils/publier-version.sh vise un commit déjà testé, et une
  # branche n'est poussée que pour son passage sur le Mac (outils/livrer-branche.sh), avant la fusion.
  # La CI tournait deux fois sur le même commit à chaque publication (la branche, puis master après la fusion).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 3 h 43, heure de Montréal (après macos.yml). GitHub la lance souvent bien plus tard (4 h 30 de retard le
    # 18 oct. 2026, 7 h 15 le 19) : regarder `gh run list --workflow ci.yml --event schedule` avant de la croire
    # absente.
    - cron: "43 7 * * *"

# Le jeton par défaut du dépôt ne lit que le code : la vérification de nuit lit aussi les exécutions passées
# (gh api …/actions/workflows/…/runs), sinon GitHub répond 403.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Tout l'historique : les textes affichés se comparent à master (outils/textes.py).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compilateurs C : YARA-X (par wasmtime) compile un petit fichier C pour chaque cible ; musl-gcc pour Linux, le
      # gcc de MinGW pour Windows (et le préprocesseur de windres, pour l'icône et le manifeste), clang pour les cibles
      # Mac, qu'il vise sans les outils d'Apple (outils/mac-entetes). La chaîne Rust est celle de rust-toolchain.toml,
      # avec ses cibles et ses composants ; nightly pour le banc de fuzzing seulement.
      - name: Rust, cibles et outils de compilation croisée
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-mingw-w64-x86-64 clang
          git branch -f master origin/master 2>/dev/null || true
      # Les tests sans Internet (unshare -rn) et les essais des outils de la clé (unshare -rmn) demandent des espaces
      # de noms d'utilisateur, qu'AppArmor refuse par défaut sur Ubuntu 24.04.
      - name: Espaces de noms d'utilisateur
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Actions venues d'autres que GitHub : épinglées par leur commit. Une étiquette (v2) se déplace ; si leur dépôt était
      # piraté, une version piégée toucherait ce que compile ce travail. À mettre à jour à la main (le commentaire dit la
      # version). Les outils dans la version épinglée ici, tels que leurs auteurs les publient (empreintes vérifiées).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-fuzz@0.13.2
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # La vérification de l'ordinateur de l'auteur, sans Wine (pas de Wine ici ; le vrai Windows est plus bas).
      - name: outils/verifier.sh
        run: outils/verifier.sh --ci
      # Le programme de mise au point, que les tests viennent de compiler (tests/programme.rs le lance) : la version
      # optimisée est compilée par le travail « reproductible ».
      - name: Le programme démarre et répond
        run: |
          ./target/x86_64-unknown-linux-musl/debug/vanguard --version
          ./target/x86_64-unknown-linux-musl/debug/vanguard logiciels --liste
          ./target/x86_64-unknown-linux-musl/debug/vanguard nettoyer --liste
      # Le bilan sur de vraies distributions (Fedora, Debian, Ubuntu, openSUSE), dans des conteneurs, avec le serveur
      # SSH installé : le programme statique que les tests viennent de compiler. Vert depuis le 20 oct. 2026
      # (exécution 39484699636) : une régression dans l'une d'elles fait échouer la CI.
      - name: Vraies distributions Linux
        run: bash outils/test-distributions.sh ./target/x86_64-unknown-linux-musl/debug/vanguard distributions
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributions
          path: distributions
          retention-days: 14

  # Garde-fou de confidentialité (outils/confidentialite.py) sur les commits de chaque envoi et de chaque demande de
  # fusion, second filet de celui qui tourne avant chaque commit et chaque envoi sur l'ordinateur de développement. Ici
  # en mode générique : seulement ce qui se reconnaît à sa forme (dossier personnel d'un compte, courriel, SID de
  # Windows) ; l'identité de la machine qui le lance n'y entre pas, le compte « runner » et /home/runner ne sont à
  # personne. Les valeurs trouvées sont coupées dans le journal, lisible sur GitHub.
  confidentialite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tout l'historique : le commit d'avant l'envoi doit être là pour savoir ce qui a été envoyé.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # AVANT vide ou fait de zéros (branche neuve), ou disparu (historique réécrit) : les commits qu'aucune autre
      # branche de GitHub n'a déjà. Les empreintes passent par l'environnement, jamais collées dans le script.
      - name: Rien de personnel dans les commits envoyés
        env:
          AVANT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          APRES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 outils/confidentialite.py --generique --plage "$AVANT" "$APRES"

  # Failles connues dans les dépendances (base RustSec, cargo audit et cargo deny) : chaque nuit, même sans changement
  # de code, car les failles arrivent sans lui ; et à la demande. Les étapes « dépendances » et « failles connues » de
  # outils/verifier.sh, les mêmes que sur l'ordinateur de l'auteur (cargo deny sur Vanguard, la bibliothèque des
  # extensions, l'exemple en Rust et le banc de fuzzing ; cargo audit jugé par outils/failles-programmes.sh --depot).
  # Rien à compiler : seuls les Cargo.lock et les Cargo.toml des dépendances sont lus.
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none
      - name: Dépendances et failles connues (outils/verifier.sh)
        run: outils/verifier.sh --seulement dependances,failles-connues

  # Les canaris de format (src/canaris.rs), chaque nuit et à la demande : chaque vraie source (Échap, KEV,
  # endoflife.date, Homebrew, Edge, Chrome, Mozilla…), téléchargée par la même demande que le programme, relue par son
  # lecteur. Le code de master ne change pas la nuit, les sources si : un format changé se voit ici, même l'ordinateur
  # de l'auteur éteint (sa veille de nuit fait de même sur « prochaine »). Un échec = un courriel de GitHub.
  canaris:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust et compilation musl
        run: |
          rustup toolchain install
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Canaris (sources téléchargées, relues par les lecteurs du programme)
        run: |
          d="$RUNNER_TEMP/canaris"
          mkdir -p "$d"
          VANGUARD_CANARIS="$d" cargo test -q --bin vanguard canaris::canaris_telecharger -- --ignored --exact
          VANGUARD_CANARIS="$d" cargo test -q --bin vanguard canaris::canaris_kev -- --ignored --exact
          VANGUARD_ESSAI_PERIMES="$d" VANGUARD_ESSAI_ECHAP="$d/ioc.yaml" cargo test -q --bin vanguard -- \
            vraies_copies_si_presentes vraie_copie_si_presente vrai_fichier_d_echap

  # Le banc de fuzzing (fuzz/), cinq minutes par cible chaque nuit, et à la demande : verifier.sh n'y passe que
  # quelques secondes. Le corpus appris d'une nuit est repris la suivante (cache de GitHub) ; une donnée qui fait
  # planter un lecteur est gardée dans les artefacts, pour en faire un test de non-régression.
  fuzzing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Chaîne nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Cinq minutes par cible
        run: VANGUARD_FUZZ="$RUNNER_TEMP/fuzz" outils/fuzz.sh tout 300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-plantages
          path: |
            ${{ runner.temp }}/fuzz/plantages
            ${{ runner.temp }}/fuzz/*.log
          retention-days: 30

  # Windows à chaque envoi, à chaque demande de fusion et à la demande ; la nuit, seulement si le code a changé depuis
  # le dernier passage réussi (comme macos.yml). La liste des fichiers que le programme n'intègre pas est dans
  # .github/hors-code.txt, la même pour macos.yml et outils/publier-version.sh.
  utile:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.verifier.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/hors-code.txt
          sparse-checkout-cone-mode: false
      - id: verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.event_name }}" in
            push|workflow_dispatch|pull_request) echo "windows=oui" >> "$GITHUB_OUTPUT"; exit 0 ;;
            schedule) ;;
            *) echo "windows=non" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          dernier=""
          for evenement in schedule workflow_dispatch push; do
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&event=$evenement&branch=${{ github.ref_name }}&per_page=1" -q '.workflow_runs[0] | "\(.created_at) \(.head_sha)"' 2>/dev/null || true)
            if [ -n "$sha" ] && [ "$sha" \> "$dernier" ]; then dernier=$sha; fi
          done
          dernier=${dernier#* }
          # Le code a changé : un fichier hors de .github/hors-code.txt. Comparaison impossible : on teste.
          HORS_CODE=$(grep -v '^#' .github/hors-code.txt | head -n 1)
          # Liste absente ou vide : un motif vide écarterait tous les fichiers, et Windows serait sauté à tort.
          [ -n "$HORS_CODE" ] || { echo "::warning::.github/hors-code.txt illisible : on teste"; HORS_CODE='^$'; }
          windows=oui
          if [ "$dernier" = "${{ github.sha }}" ]; then
            windows=non
          elif [ -n "$dernier" ] && fichiers=$(gh api "repos/${{ github.repository }}/compare/$dernier...${{ github.sha }}" -q '[.files[].filename] | if length < 300 then .[] else "plus de 300 fichiers" end'); then
            printf '%s\n' "$fichiers" | grep -vE -e '^$' -e "$HORS_CODE" >/dev/null || windows=non
          fi
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  # Compilation reproductible : le même code, compilé deux fois de suite, doit donner exactement le même programme
  # (Linux et Windows), par la recette de l'ordinateur de l'auteur (outils/compiler-version.sh : chaîne de
  # rust-toolchain.toml, Cargo.lock tel quel, chemins de la compilation retirés, cargo-auditable de la version
  # ci-dessous). C'est la condition de la preuve d'intégrité d'un programme non signé. Les empreintes sont écrites
  # dans le journal (EMPREINTE-VANGUARD-…) : à comparer à celles de la page de la version ; ce qui peut encore les
  # faire différer d'un ordinateur à l'autre est dit dans CONTRIBUTING.md (« Compilation reproductible »). Le .exe
  # passe ensuite au travail « windows-livre », qui le fait tourner sur un vrai Windows.
  reproductible:
    needs: utile
    if: needs.utile.outputs.windows == 'oui' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # gcc-mingw-w64 : l'éditeur de liens du .exe, et le préprocesseur de windres (icône et manifeste intégrés comme
      # dans le .exe livré). Avec les binutils seuls, la première nuit a échoué : « linker x86_64-w64-mingw32-gcc not
      # found ».
      - name: Rust, cibles et outils de compilation croisée
        run: |
          rustup toolchain install
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # cargo auditable grave dans chaque programme la liste de ses dépendances, versions comprises, que cargo audit
      # relit. Les deux outils dans la version épinglée ici, que outils/deployer.sh et outils/failles-programmes.sh
      # exigent aussi sur l'ordinateur de l'auteur ; jamais de repli sur une compilation ou un autre téléchargement.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-auditable@0.7.7,cargo-audit@0.22.2
          fallback: none
      # Les deux cibles d'un seul cargo : l'optimisation finale (LTO, une seule unité de code) n'occupe qu'un cœur par
      # programme, et cargo les mène de front ; deux cargo lancés ensemble s'attendraient (verrou du dossier).
      - name: Deux compilations, un seul programme
        run: |
          outils/compiler-version.sh
          mkdir premiere
          cp target/x86_64-unknown-linux-musl/release/vanguard premiere/vanguard
          cp target/x86_64-pc-windows-gnu/release/vanguard.exe premiere/vanguard.exe
          # Seul le programme est recompilé (les dépendances restent) : c'est lui que l'on compare.
          cargo clean -p vanguard --release --target x86_64-unknown-linux-musl
          cargo clean -p vanguard --release --target x86_64-pc-windows-gnu
          outils/compiler-version.sh
          cmp premiere/vanguard target/x86_64-unknown-linux-musl/release/vanguard
          cmp premiere/vanguard.exe target/x86_64-pc-windows-gnu/release/vanguard.exe
          echo "EMPREINTE-VANGUARD-LINUX $(sha256sum premiere/vanguard | cut -d' ' -f1)"
          echo "EMPREINTE-VANGUARD-WINDOWS $(sha256sum premiere/vanguard.exe | cut -d' ' -f1)"
          rustc --version
          x86_64-w64-mingw32-gcc --version | head -n 1
          musl-gcc --version 2>/dev/null | head -n 1 || true
      # Ce que l'ordinateur de l'auteur vérifie avant de livrer : DLL depuis System32 seulement, manifeste UTF-8 et
      # asInvoker ; puis les failles connues des deux programmes, lues dans la liste qu'ils portent.
      - name: Le .exe porte ses gardes, failles connues des programmes
        run: |
          target/x86_64-unknown-linux-musl/release/vanguard deploiement verifier-pe target/x86_64-pc-windows-gnu/release/vanguard.exe
          bash outils/failles-programmes.sh target/x86_64-unknown-linux-musl/release/vanguard \
            target/x86_64-pc-windows-gnu/release/vanguard.exe
      - uses: actions/upload-artifact@v7
        with:
          name: vanguard-windows-livre
          path: target/x86_64-pc-windows-gnu/release/vanguard.exe
          retention-days: 7

  windows:
    needs: utile
    if: needs.utile.outputs.windows == 'oui'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # La cible est donnée : .cargo/config.toml vise Linux par défaut. Ici, PowerShell existe vraiment (pas comme
      # sous Wine) : les tests lisent le vrai registre et le vrai système. La cible MSVC : celle de MinGW, livrée, est
      # essayée telle qu'elle part par le travail « windows-livre ».
      # Les tests qui ne peuvent pas tourner ici (registre inaccessible…) le notent dans VANGUARD_TESTS_SAUTES
      # (src/essais.rs) : sans lui, libtest avale leur message et les compte réussis. Comptés et montrés au résumé,
      # même si les tests échouent : non vérifié n'est jamais compté sain, comme dans outils/verifier.sh.
      - name: Tests sur un vrai Windows
        env:
          VANGUARD_TESTS_SAUTES: ${{ runner.temp }}\sautes.txt
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Tests sautés sur le vrai Windows
        if: always()
        env:
          VANGUARD_TESTS_SAUTES: ${{ runner.temp }}\sautes.txt
        run: |
          if (Test-Path $env:VANGUARD_TESTS_SAUTES) {
            $l = @(Get-Content $env:VANGUARD_TESTS_SAUTES)
            "::warning::$($l.Count) tests sautés (non vérifiés)"
            "### Tests sautés sur Windows : $($l.Count)" >> $env:GITHUB_STEP_SUMMARY
            $l | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Essai du programme (lecture seule)
        run: |
          $s = ".\target\x86_64-pc-windows-msvc\debug\vanguard.exe"
          & $s --version
          & $s audit --json > audit.json
          Get-Content audit.json -TotalCount 40
          & $s logiciels --liste
          & $s nettoyer --liste
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-windows
          path: audit.json
          retention-days: 14

  # Le .exe livré (MinGW, version publiée, compilé par « reproductible » selon la recette de l'auteur) sur un vrai
  # Windows : la CI testait jusque-là la cible MSVC, que personne ne reçoit, et le .exe livré ne tournait que sous Wine
  # ou à la main dans la VM. Lecture seule ; le bilan en JSON doit se lire, et ses accents passer (manifeste UTF-8).
  windows-livre:
    needs: reproductible
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vanguard-windows-livre
      - name: Le .exe livré démarre, fait son bilan et répond
        run: |
          # La sortie du programme lue en UTF-8 par PowerShell : un accent perdu doit venir du .exe, pas d'ici.
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $s = ".\vanguard.exe"
          "EMPREINTE-VANGUARD-WINDOWS-ESSAYE $((Get-FileHash $s -Algorithm SHA256).Hash.ToLower())"
          & $s --version
          if ($LASTEXITCODE -ne 0) { throw "--version : code $LASTEXITCODE" }
          $env:VANGUARD_LANG = 'fr'
          & $s audit --json > audit.json
          $bilan = Get-Content audit.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $bilan.constats) { throw "bilan sans constats" }
          $aide = (& $s --help | Out-String)
          if ($aide -notmatch 'Cyberdéfense') { throw "accents perdus dans l'aide (manifeste UTF-8 ?) : $aide" }
          & $s logiciels --liste
          & $s nettoyer --liste
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-windows-livre
          path: audit.json
          retention-days: 14
