# Banc de fuzzing de Vanguard (cargo-fuzz, libFuzzer) : à part, jamais compilé avec le programme. Il a son propre
# espace de travail (« [workspace] » ci-dessous) ; chaque cible inclut un module de ../src par son chemin, avec une
# petite cale pour les quelques `crate::` dont il a besoin (cale/). Lancer : outils/fuzz.sh (chaîne nightly).
[package]
name = "vanguard-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
# Les mêmes que Vanguard (../Cargo.toml) pour les modules inclus.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2.191"
# Les lecteurs gzip et zip (src/archives/) : la même version que Cargo.lock de Vanguard.
miniz_oxide = "=0.9.1"
# L'empreinte des parties de l'analyse des fichiers (src/analyse/) : la même que Cargo.lock de Vanguard.
sha2 = { version = "=0.11.1", default-features = false }

# `fuzzing` : posé par cargo-fuzz ; src/sqlite.rs s'en sert pour ouvrir sa lecture des colonnes ici.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace]
members = ["."]

[[bin]]
name = "plist"
path = "fuzz_targets/plist.rs"
test = false
doc = false
bench = false

