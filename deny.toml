# Ce que les dépendances de Vanguard ont le droit d'être, vérifié par cargo deny (outils/verifier.sh, et chaque nuit
# dans la CI) : failles connues (base RustSec), licences, provenance, doublons.

# Les deux cibles livrées, comme outils/licences-tierces.py : une dépendance propre à un autre système (Android,
# WebAssembly…) n'est jamais compilée dans Vanguard.
[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
]

# Failles connues, bibliothèques abandonnées ou au code défaillant (unsound) : refusées, dans tout l'arbre (sans
# « all », cargo deny ne regarde le code défaillant que dans les dépendances directes). Une version retirée de
# crates.io (yanked) est seulement signalée, dans le résumé d'outils/verifier.sh : elle n'est pas forcément
# dangereuse. Une faille s'ôte en mettant la dépendance à jour. Chaque exception est dite ici, avec sa raison,
# affichée à chaque passage (outils/verifier.sh), et l'exception devenue inutile fait échouer
# (advisory-not-detected), pour qu'on l'ôte. La raison commence par le nom de la bibliothèque et une virgule :
# outils/verifier.sh la cite dans son résumé. Deux sortes d'exceptions :
# - rsa et bincode, venues de YARA-X : sans correctif publié et pour un défaut que Vanguard ne peut pas atteindre,
#   avec sa preuve, à relire à chaque mise à jour de YARA-X. Elles valent pour l'avis dans tout l'arbre : [bans]
#   réserve la bibliothèque à YARA-X, qui n'est plus qu'une dépendance de développement (l'oracle des tests du moteur
#   YARA maison, src/protection/oracle_yara.rs) : jamais dans les programmes publiés, mais compilé et lancé ici par
#   les tests.
# - chrono, différente : une dépendance directe, compilée dans les programmes publiés, déclarée abandonnée sans
#   aucune faille connue ni version corrigée. Ce n'est pas un défaut écarté par une preuve, mais un abandon admis
#   pour un temps, par choix de l'auteur (17 nov. 2026), en attendant son remplacement par jiff. La même exception
#   est dans fenetre/deny.toml et fuzz/deny.toml, qui ont chrono en dépendance directe eux aussi.
# Une exception ne vaut pour les programmes publiés (outils/failles-programmes.sh <programme>) que si sa raison le dit
# mot pour mot (« vaut pour les programmes publiés ») : rsa et bincode ne le disent pas, et YARA-X devenue par erreur
# une dépendance normale y ferait échouer l'audit. Une date (« à relire au plus tard le AAAA-MM-JJ ») passée est dite à
# chaque vérification (outils/verifier.sh).
[advisories]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa, par YARA-X seulement ([bans]), sans version corrigée : l'attaque Marvin vise les opérations à clé privée (déchiffrement), YARA-X ne fait que vérifier des signatures Authenticode avec une clé publique (modules/utils/crypto.rs, RsaPublicKey)" },
    { id = "RUSTSEC-2025-0141", reason = "bincode, par YARA-X seulement ([bans]) et sans réglage qui l'ôte, abandonné mais sans faille connue : YARA-X n'y encode puis n'y relit que ses propres variables globales (compilation des règles intégrées, puis chaque Scanner::new), dans le même processus ; Vanguard n'appelle jamais Rules::deserialize : aucune donnée venue d'ailleurs ne passe par bincode" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, dépendance directe, déclarée abandonnée (14 sept. 2026), sans faille connue ni version corrigée : admise le 17 nov. 2026 en attendant son remplacement par jiff, pas écartée par une preuve ; vaut pour les programmes publiés ; à relire au plus tard le 2027-01-17" },
]

# Les licences déjà présentes parmi les dépendances (LICENCES-TIERCES.txt), toutes permissives : compatibles avec la
# GPL-3.0-or-later de Vanguard comme avec la double licence qu'il garde possible (CLAUDE.md). Toute autre, même libre
# et compatible avec la GPL (MPL, LGPL, GPL…), demande d'abord une décision : CLAUDE.md, « Nouvelle dépendance ». Une
# exception devenue inutile fait échouer.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# La GPL, seulement pour Vanguard lui-même.
exceptions = [
    { crate = "vanguard", allow = ["GPL-3.0-or-later"] },
]
unused-license-exception = "deny"

# Les doublons (deux versions d'une même bibliothèque) sont dits, sans faire échouer : ils grossissent le programme,
# mais viennent presque tous de dépendances de dépendances, hors de portée.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les bibliothèques aux failles admises plus haut, seulement sous YARA-X : une exception vaut pour son avis dans tout
# l'arbre, et une autre bibliothèque qui tirerait rsa (pour déchiffrer avec une clé privée, que l'attaque Marvin vise)
# passerait sinon sans un mot.
deny = [
    { crate = "rsa", wrappers = ["yara-x"], reason = "RUSTSEC-2023-0071 admise pour YARA-X seulement ([advisories])" },
    { crate = "bincode", wrappers = ["yara-x"], reason = "RUSTSEC-2025-0141 admise pour YARA-X seulement ([advisories])" },
# Les bibliothèques qui posent du code lancé avant main (ou après lui), dans .init_array sous Linux ou .CRT$XCU
# sous Windows : il tourne avant tout journal et tout filet de panique, sans qu'aucune ligne ne l'appelle.
# Refusées ; la même liste dans deny.toml, fenetre/, extensions/ et fuzz/ (outils/essais-constructeurs.sh
# vérifie qu'elles disent pareil).
# inventory : seulement par Vanguard lui-même et par YARA-X, qui l'amènent aujourd'hui.
    { crate = "ctor", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "ctor-lite", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "ctor-proc-macro", reason = "les macros de ctor (outils/essais-constructeurs.sh)" },
    { crate = "dtor", reason = "code lancé après main (outils/essais-constructeurs.sh)" },
    { crate = "dtor-proc-macro", reason = "les macros de dtor (outils/essais-constructeurs.sh)" },
    { crate = "inventory", wrappers = ["vanguard", "yara-x"], reason = "code lancé avant main : Vanguard (autotest/croisees.rs) et YARA-X seulement" },
    { crate = "link-section", reason = "sections lues au démarrage (outils/essais-constructeurs.sh)" },
    { crate = "linkme", reason = "sections lues au démarrage (outils/essais-constructeurs.sh)" },
    { crate = "small_ctor", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "startup", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "static_init", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
]

# crates.io seulement : ni autre registre, ni dépôt git, d'où un code non relu pourrait entrer.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
