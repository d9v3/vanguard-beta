# Ce que les dépendances de la fenêtre (vanguard-fenetre, crate à part avec son Cargo.lock) ont le droit d'être,
# vérifié par cargo deny (outils/verifier.sh), comme deny.toml pour Vanguard. À part de deny.toml : ses failles
# admises (venues de YARA-X) n'ont rien à faire ici, et les bibliothèques d'affichage de la fenêtre n'y sont pas.

# Les cibles de la fenêtre : Linux avec la libc du système (ses bibliothèques d'affichage sont chargées à
# l'exécution) et Windows. verifier.sh passe chacune à part (--target) : sur les deux d'un coup, cargo deny unit les
# options des deux, et compterait sous Linux l'accessibilité de Windows (accesskit_unix, voir Cargo.toml). C'est ce
# que faisait la compilation des programmes publiés jusqu'au 12 nov. 2026 (les deux cibles dans un seul appel de
# cargo) : outils/compiler-version.sh compile désormais une cible à la fois, et outils/caisses-fenetre.sh vérifie sur
# leurs octets que chaque programme ne contient que l'arbre jugé ici.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
]

# Failles connues, bibliothèques abandonnées ou au code défaillant : refusées, dans tout l'arbre. Une seule exception,
# la même que dans deny.toml : chrono, dépendance directe de la fenêtre, déclarée abandonnée sans faille connue ni
# version corrigée ; pas un défaut écarté par une preuve, mais un abandon admis pour un temps (17 nov. 2026), en
# attendant son remplacement par jiff. Les exceptions de YARA-X (rsa, bincode) n'ont rien à faire ici. La raison
# commence par le nom de la bibliothèque et une virgule, comme dans deny.toml. outils/failles-programmes.sh donne à
# cargo audit les exceptions de ce fichier-ci pour fenetre/Cargo.lock et les programmes de la fenêtre
# (outils/exceptions-rustsec.py fenetre/deny.toml).
[advisories]
unmaintained = "all"
unsound = "all"
# Comme deny.toml : une exception qui ne sert plus fait échouer, pour qu'on l'ôte.
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono, dépendance directe, déclarée abandonnée (14 sept. 2026), sans faille connue ni version corrigée : admise le 17 nov. 2026 en attendant son remplacement par jiff, pas écartée par une preuve" },
]

# Les licences permises de deny.toml qu'une des deux cibles rencontre, rien de plus ; la fenêtre elle-même
# (GPL-3.0-or-later) est nommée. Une licence que l'autre cible seule rencontre n'est pas une remarque. En plus, pour
# la fenêtre seule : BSL-1.0 (Boost, courte et permissive comme MIT), celle de clipboard-win et error-code, que le
# presse-papiers de Windows amène (arboard) ; acceptée par l'auteur le 10 nov. 2026.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "vanguard-fenetre", allow = ["GPL-3.0-or-later"] },
]
unused-license-exception = "deny"
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Les bibliothèques qui posent du code lancé avant main (ou après lui), dans .init_array sous Linux ou .CRT$XCU
# sous Windows : il tourne avant tout journal et tout filet de panique, sans qu'aucune ligne ne l'appelle.
# Refusées ; la même liste dans deny.toml, fenetre/, extensions/ et fuzz/ (outils/essais-constructeurs.sh
# vérifie qu'elles disent pareil).
deny = [
    { crate = "ctor", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "ctor-lite", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "ctor-proc-macro", reason = "les macros de ctor (outils/essais-constructeurs.sh)" },
    { crate = "dtor", reason = "code lancé après main (outils/essais-constructeurs.sh)" },
    { crate = "dtor-proc-macro", reason = "les macros de dtor (outils/essais-constructeurs.sh)" },
    { crate = "inventory", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "link-section", reason = "sections lues au démarrage (outils/essais-constructeurs.sh)" },
    { crate = "linkme", reason = "sections lues au démarrage (outils/essais-constructeurs.sh)" },
    { crate = "small_ctor", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "startup", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
    { crate = "static_init", reason = "code lancé avant main (outils/essais-constructeurs.sh)" },
]

# crates.io seulement : ni autre registre, ni dépôt git.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
